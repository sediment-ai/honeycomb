# export — sediment fleet agent
role: export
pod: buzz-agent-e2690234d90a
pubkey12: e2690234d90a
harness: pi            # custom harness id in Buzz; command pi-acp
base_secret: buzz-agent-e2690234d90a-plain1    # live cluster Secret holding credentials; referenced, never edited
model_id: deepseek-v4-pro
context_window: 1000000
max_tokens: 65536
pool: 4                # BUZZ_ACP_AGENTS — sized so parallel sessions cannot OOM the node
idle_timeout: 900      # pi-acp sends no liveness pings; a quiet subprocess (uv sync) must not read as a hang
max_turn_duration: 3600
prompt: prompts/export.md
rust_log: buzz_acp=debug
