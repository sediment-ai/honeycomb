apiVersion: v1
kind: Pod
metadata:
  name: {{POD}}
  namespace: buzz-agents
  labels:
    app: buzz-agent
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 60
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: k3d-fleet-reg:5555/sediment-agent@{{DIGEST}}
      envFrom:
        - secretRef:
            name: {{SECRET}}
            optional: false
      env:
        # This fleet runs one session per task, so pi's "settled" is session
        # end: the shim ships the session's edit pairs when the task finishes.
        # Without it the pairs wait for the entrypoint's SIGTERM sweep, which
        # means survival lands only when the pod dies — hours to days late, and
        # not at all on an OOM kill (sediment-ai/sediment#501).
        - name: SEDIMENT_EXTRACT_ON_SETTLE
          value: "1"
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: "2", memory: 4Gi}
      volumeMounts:
        - name: workspace
          mountPath: /home/agent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
  volumes:
    - name: workspace
      emptyDir: {}
